<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff;
      --text: #1a1a1a;
      --text-muted: #666;
      --border: #ccc;
      --border-strong: #ccc;
      --border-subtle: #e0e0e0;
      --border-footer: #eee;
      --input-bg: #fff;
      --btn-bg: #fff;
      --btn-hover: #f5f5f5;
      --accent: #4a90d9;
      --accent-hover: #3a7bc8;
      --card-bg: #f8f9fa;
      --muted-bg: #f0f0f0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --text: #e8e8e8;
        --text-muted: #999;
        --border: #444;
        --border-strong: #555;
        --border-subtle: #333;
        --border-footer: #2e2e2e;
        --input-bg: #252525;
        --btn-bg: #2a2a2a;
        --btn-hover: #333;
        --accent: #5a9fd4;
        --accent-hover: #4a8fc4;
        --card-bg: #252525;
        --muted-bg: #222;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }

    .mode-toggle {
      display: flex;
      gap: 0;
      margin-bottom: 1.25rem;
    }

    .mode-toggle button {
      flex: 1;
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text);
      transition: background 0.15s, color 0.15s;
    }

    .mode-toggle button:first-child {
      border-radius: 6px 0 0 6px;
      border-right: none;
    }

    .mode-toggle button:last-child {
      border-radius: 0 6px 6px 0;
    }

    .mode-toggle button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .mode-toggle button:not(.active):hover {
      background: var(--btn-hover);
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    input[type="time"] {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      flex: 1;
      min-width: 0;
    }

    input[type="time"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    .btn {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      background: var(--btn-bg);
      color: var(--text);
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--btn-hover);
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn.primary:hover {
      background: var(--accent-hover);
    }

    #results {
      margin-bottom: 1.5rem;
    }

    .results-heading {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .results-subheading {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.75rem;
      text-align: center;
    }

    .card.optimal {
      border-left: 3px solid var(--accent);
    }

    .card-time {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .card-detail {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .card-badge {
      font-size: 0.65rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.35rem;
    }

    .results-grid.muted .card {
      background: var(--muted-bg);
    }

    .results-grid.muted .card-time {
      font-size: 1.1rem;
    }

    details.settings {
      margin-bottom: 1.5rem;
    }

    details.settings summary {
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    details.settings summary:hover {
      color: var(--text);
    }

    .settings-body {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }

    .settings-body label {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .settings-body input[type="number"] {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--input-bg);
      color: var(--text);
      width: 4rem;
      text-align: center;
    }

    .settings-body input[type="number"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    footer {
      padding-top: 1rem;
      border-top: 1px solid var(--border-footer);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <h1>Sleep Calculator</h1>
  <p class="subtitle">Find optimal sleep and wake times based on sleep cycles.</p>

  <div class="mode-toggle">
    <button id="mode-wake" class="active">I want to wake up at&hellip;</button>
    <button id="mode-sleep">I want to sleep at&hellip;</button>
  </div>

  <div class="input-group">
    <label id="time-label">Wake-up time</label>
    <div class="input-row">
      <input type="time" id="time-input">
      <button class="btn primary" id="sleep-now-btn" style="display: none;">Sleep Now</button>
    </div>
  </div>

  <div id="results"></div>

  <details class="settings">
    <summary>Settings</summary>
    <div class="settings-body">
      <label>Sleep cycle length <input type="number" id="cycle-length" value="90" min="60" max="120"> min</label>
      <label>Time to fall asleep <input type="number" id="fall-asleep" value="15" min="0" max="60"> min</label>
    </div>
  </details>

  <footer>
    <a href="./">Tools</a> &middot; <a href="https://github.com/henrythach/tools/blob/main/sleep-calculator.html">Source</a>
  </footer>

  <script>
    const modeWakeBtn = document.getElementById('mode-wake');
    const modeSleepBtn = document.getElementById('mode-sleep');
    const timeLabel = document.getElementById('time-label');
    const timeInput = document.getElementById('time-input');
    const sleepNowBtn = document.getElementById('sleep-now-btn');
    const resultsEl = document.getElementById('results');
    const cycleLengthInput = document.getElementById('cycle-length');
    const fallAsleepInput = document.getElementById('fall-asleep');

    let mode = 'wake'; // 'wake' or 'sleep'

    const setMode = (newMode) => {
      mode = newMode;
      modeWakeBtn.classList.toggle('active', mode === 'wake');
      modeSleepBtn.classList.toggle('active', mode === 'sleep');
      timeLabel.textContent = mode === 'wake' ? 'Wake-up time' : 'Sleep time';
      sleepNowBtn.style.display = mode === 'sleep' ? 'inline-block' : 'none';
      calculate();
    };

    modeWakeBtn.addEventListener('click', () => setMode('wake'));
    modeSleepBtn.addEventListener('click', () => setMode('sleep'));

    sleepNowBtn.addEventListener('click', () => {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      timeInput.value = `${hh}:${mm}`;
      calculate();
    });

    timeInput.addEventListener('input', calculate);
    cycleLengthInput.addEventListener('input', calculate);
    fallAsleepInput.addEventListener('input', calculate);

    const formatDuration = (minutes) => {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return m > 0 ? `${h}h ${m}m` : `${h}h`;
    };

    const formatTime = (date) =>
      date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

    function calculate() {
      const timeValue = timeInput.value;
      if (!timeValue) {
        resultsEl.innerHTML = '';
        return;
      }

      const [hours, minutes] = timeValue.split(':').map(Number);
      const cycleLen = parseInt(cycleLengthInput.value) || 90;
      const fallAsleep = parseInt(fallAsleepInput.value) || 15;
      const cycles = [6, 5, 4, 3, 2, 1];

      const baseTime = new Date();
      baseTime.setHours(hours, minutes, 0, 0);

      const results = cycles.map(n => {
        const totalMin = n * cycleLen + fallAsleep;
        let time;
        if (mode === 'wake') {
          time = new Date(baseTime.getTime() - totalMin * 60000);
        } else {
          time = new Date(baseTime.getTime() + totalMin * 60000);
        }
        return { cycles: n, time, duration: n * cycleLen };
      });

      renderResults(results);
    }

    function createCard(result, isOptimal) {
      const card = document.createElement('div');
      card.className = isOptimal ? 'card optimal' : 'card';
      card.innerHTML = `
        <div class="card-time">${formatTime(result.time)}</div>
        <div class="card-detail">${result.cycles} cycle${result.cycles !== 1 ? 's' : ''} &middot; ${formatDuration(result.duration)}</div>
        ${isOptimal ? '<div class="card-badge">recommended</div>' : ''}
      `;
      return card;
    }

    function renderResults(results) {
      resultsEl.innerHTML = '';

      const optimal = results.filter(r => r.cycles >= 5);
      const other = results.filter(r => r.cycles < 5);

      const heading = document.createElement('p');
      heading.className = 'results-heading';
      heading.textContent = mode === 'wake'
        ? 'Try to fall asleep at one of these times:'
        : 'Set your alarm for one of these times:';
      resultsEl.appendChild(heading);

      const optGrid = document.createElement('div');
      optGrid.className = 'results-grid';
      optimal.forEach(r => optGrid.appendChild(createCard(r, true)));
      resultsEl.appendChild(optGrid);

      if (other.length) {
        const sub = document.createElement('p');
        sub.className = 'results-subheading';
        sub.textContent = 'Other options (fewer cycles):';
        resultsEl.appendChild(sub);

        const mutedGrid = document.createElement('div');
        mutedGrid.className = 'results-grid muted';
        other.forEach(r => mutedGrid.appendChild(createCard(r, false)));
        resultsEl.appendChild(mutedGrid);
      }
    }
  </script>
</body>
</html>
