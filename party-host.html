<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party Host</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #fff;
        --text: #1a1a1a;
        --text-muted: #666;
        --border: #ccc;
        --border-subtle: #e0e0e0;
        --border-footer: #eee;
        --input-bg: #fff;
        --btn-bg: #fff;
        --btn-hover: #f5f5f5;
        --accent: #4a90d9;
        --accent-hover: #3a7bc8;
        --card-bg: #f8f9fa;
        --muted-bg: #f0f0f0;
        --danger: #dc2626;
        --danger-bg: #fee2e2;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --text: #e8e8e8;
          --text-muted: #999;
          --border: #444;
          --border-subtle: #333;
          --border-footer: #2e2e2e;
          --input-bg: #252525;
          --btn-bg: #2a2a2a;
          --btn-hover: #333;
          --accent: #5a9fd4;
          --accent-hover: #4a8fc4;
          --card-bg: #252525;
          --muted-bg: #222;
          --danger: #f87171;
          --danger-bg: #450a0a;
        }
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 1.5rem;
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
        max-width: 480px;
        margin: 0 auto;
      }

      h1 {
        font-size: 1.4rem;
        margin-bottom: 0.25rem;
      }
      .subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 1.25rem;
      }

      /* Buttons */
      button {
        font-family: inherit;
        font-size: 0.85rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--btn-bg);
        color: var(--text);
        cursor: pointer;
        touch-action: manipulation;
      }
      button:hover {
        background: var(--btn-hover);
      }
      button:active {
        opacity: 0.8;
      }

      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      button.primary:hover {
        background: var(--accent-hover);
      }

      button.danger {
        background: transparent;
        color: var(--danger);
        border-color: var(--danger);
      }
      button.danger:hover {
        background: var(--danger-bg);
      }

      /* Inputs */
      textarea,
      input[type="text"] {
        font-family: inherit;
        font-size: 0.85rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--input-bg);
        color: var(--text);
        width: 100%;
      }
      textarea:focus,
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      footer {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-footer);
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      footer a {
        color: var(--text-muted);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--text);
      }

      /* ── Setup view ── */
      #setup-view {
        display: none;
      }
      #setup-view.active {
        display: block;
      }

      .setup-label {
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.4rem;
        display: block;
      }

      #names-input {
        resize: vertical;
        min-height: 160px;
      }

      .setup-hint {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.4rem;
        margin-bottom: 1rem;
      }

      /* ── Game view ── */
      #game-view {
        display: none;
      }
      #game-view.active {
        display: block;
      }

      .current-card {
        background: var(--card-bg);
        border: 1px solid var(--border-subtle);
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
      }

      .current-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.3rem;
      }

      .current-name {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 1rem;
        line-height: 1.2;
        word-break: break-word;
      }

      .score-row {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .score-display {
        font-size: 1.5rem;
        font-weight: 700;
        min-width: 3rem;
        text-align: center;
      }

      .score-btns {
        display: flex;
        gap: 0.5rem;
      }

      .score-btn {
        width: 56px;
        height: 56px;
        font-size: 1.5rem;
        font-weight: 700;
        border-radius: 8px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .score-btn.minus {
        background: var(--muted-bg);
        border-color: var(--border);
      }
      .score-btn.minus:hover {
        background: var(--btn-hover);
      }

      .score-btn.plus {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .score-btn.plus:hover {
        background: var(--accent-hover);
      }

      /* Others scoreboard */
      .others-heading {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
      }

      .others-list {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        margin-bottom: 1.25rem;
      }

      .other-player {
        display: flex;
        align-items: center;
        padding: 0.45rem 0.6rem;
        background: var(--muted-bg);
        border-radius: 6px;
        font-size: 0.875rem;
        gap: 0.5rem;
      }

      .other-pos {
        font-size: 0.75rem;
        color: var(--text-muted);
        min-width: 1.25rem;
        flex-shrink: 0;
      }

      .other-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .other-score {
        font-weight: 600;
        flex-shrink: 0;
        color: var(--text-muted);
      }

      .next-btn {
        width: 100%;
        padding: 0.85rem;
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
      }

      .reset-btn {
        width: 100%;
        padding: 0.6rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <!-- Setup view -->
    <div id="setup-view">
      <h1>Party Host</h1>
      <p class="subtitle">Enter players, then start. First turn is random.</p>

      <label class="setup-label" for="names-input">Players</label>
      <textarea id="names-input" placeholder="Sarah&#10;Alex&#10;Jordan&#10;Mia"></textarea>
      <p class="setup-hint">One name per line. Minimum 2 players.</p>

      <button
        class="primary"
        id="start-btn"
        style="width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 600"
        disabled
      >
        Start Game
      </button>

      <footer>
        <a href="./">Tools</a> &middot;
        <a href="https://github.com/henrythach/tools/blob/main/party-host.html">Source</a>
      </footer>
    </div>

    <!-- Game view -->
    <div id="game-view">
      <div class="current-card">
        <div class="current-label">Current turn</div>
        <div class="current-name" id="current-name"></div>
        <div class="score-row">
          <div class="score-display" id="current-score">0</div>
          <div class="score-btns">
            <button class="score-btn minus" id="minus-btn">−</button>
            <button class="score-btn plus" id="plus-btn">+</button>
          </div>
        </div>
      </div>

      <div id="others-section" style="display: none">
        <div class="others-heading">Up next</div>
        <div class="others-list" id="others-list"></div>
      </div>

      <button class="primary next-btn" id="next-btn">Next Player →</button>
      <button class="danger reset-btn" id="reset-btn">Reset Game</button>

      <footer>
        <a href="./">Tools</a> &middot;
        <a href="https://github.com/henrythach/tools/blob/main/party-host.html">Source</a>
      </footer>
    </div>

    <script>
      const LS_KEY = "party-host-state";
      const $ = (id) => document.getElementById(id);

      let state = null;

      function loadState() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (raw) return JSON.parse(raw);
        } catch (_) {}
        return null;
      }

      function saveState() {
        localStorage.setItem(LS_KEY, JSON.stringify(state));
      }

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function startGame(names) {
        const players = shuffle(names.map((name) => ({ name, score: 0 })));
        state = { players, currentIndex: 0, started: true };
        saveState();
        showGameView();
      }

      function render() {
        const { players, currentIndex } = state;
        const current = players[currentIndex];

        $("current-name").textContent = current.name;
        $("current-score").textContent = current.score;

        const list = $("others-list");
        const section = $("others-section");

        if (players.length <= 1) {
          section.style.display = "none";
          return;
        }

        section.style.display = "block";
        const rows = [];
        for (let offset = 1; offset < players.length; offset++) {
          const i = (currentIndex + offset) % players.length;
          const p = players[i];
          rows.push(`
      <div class="other-player">
        <span class="other-pos">${i + 1}.</span>
        <span class="other-name">${esc(p.name)}</span>
        <span class="other-score">${p.score}</span>
      </div>
    `);
        }
        list.innerHTML = rows.join("");
      }

      function adjustScore(delta) {
        state.players[state.currentIndex].score += delta;
        saveState();
        render();
      }

      function nextPlayer() {
        state.currentIndex = (state.currentIndex + 1) % state.players.length;
        saveState();
        render();
      }

      function resetGame() {
        localStorage.removeItem(LS_KEY);
        state = null;
        showSetupView();
      }

      function esc(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function showSetupView() {
        $("setup-view").classList.add("active");
        $("game-view").classList.remove("active");
      }

      function showGameView() {
        $("setup-view").classList.remove("active");
        $("game-view").classList.add("active");
        render();
      }

      function getValidNames() {
        return $("names-input")
          .value.split("\n")
          .map((s) => s.trim())
          .filter((s) => s.length > 0);
      }

      // Wire up setup
      $("names-input").addEventListener("input", () => {
        $("start-btn").disabled = getValidNames().length < 2;
      });

      $("start-btn").addEventListener("click", () => {
        const names = getValidNames();
        if (names.length >= 2) startGame(names);
      });

      // Wire up game controls
      $("plus-btn").addEventListener("click", () => adjustScore(1));
      $("minus-btn").addEventListener("click", () => adjustScore(-1));
      $("next-btn").addEventListener("click", nextPlayer);
      $("reset-btn").addEventListener("click", resetGame);

      // Init
      state = loadState();
      if (state && state.started) {
        showGameView();
      } else {
        showSetupView();
      }
    </script>
  </body>
</html>
