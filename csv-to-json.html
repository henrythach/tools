<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV to JSON</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #fff;
        --text: #1a1a1a;
        --text-muted: #666;
        --border: #ccc;
        --border-subtle: #e0e0e0;
        --border-footer: #eee;
        --input-bg: #fff;
        --btn-bg: #fff;
        --btn-hover: #f5f5f5;
        --accent: #4a90d9;
        --accent-hover: #3a7bc8;
        --error: #c0392b;
        --error-bg: #f8d7da;
        --code-bg: #f5f5f5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --text: #e8e8e8;
          --text-muted: #999;
          --border: #444;
          --border-subtle: #333;
          --border-footer: #2e2e2e;
          --input-bg: #252525;
          --btn-bg: #2a2a2a;
          --btn-hover: #333;
          --accent: #5a9fd4;
          --accent-hover: #4a8fc4;
          --error: #e05c4b;
          --error-bg: #3a1a1a;
          --code-bg: #2a2a2a;
        }
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 1.5rem;
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
        max-width: 700px;
        margin: 0 auto;
      }

      h1 {
        font-size: 1.4rem;
        margin-bottom: 0.25rem;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 1.25rem;
      }

      textarea {
        font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
        font-size: 0.8rem;
        width: 100%;
        height: 160px;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--input-bg);
        color: var(--text);
        resize: vertical;
      }

      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0.5rem 0;
        min-height: 1.4rem;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .error {
        color: var(--error);
        font-size: 0.8rem;
        margin: 0.25rem 0;
      }

      .actions {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
        align-items: center;
      }

      button {
        font-family: inherit;
        font-size: 0.85rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--btn-bg);
        color: var(--text);
        cursor: pointer;
      }

      button:hover {
        background: var(--btn-hover);
      }

      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      button.primary:hover {
        background: var(--accent-hover);
      }

      #output {
        font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
        font-size: 0.8rem;
        width: 100%;
        min-height: 200px;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--code-bg);
        color: var(--text);
        white-space: pre;
        overflow: auto;
      }

      footer {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-footer);
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      footer a {
        color: var(--text-muted);
        text-decoration: none;
      }

      footer a:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <h1>CSV to JSON</h1>
    <p class="subtitle">Paste CSV and get a JSON array of objects. First row is used as keys.</p>

    <textarea
      id="input"
      placeholder="name,age,city&#10;Alice,30,New York&#10;Bob,25,Chicago"
      spellcheck="false"
    ></textarea>

    <div class="meta" id="meta"></div>
    <div class="error" id="error"></div>

    <div class="actions">
      <button class="primary" id="copy">Copy JSON</button>
      <button id="clear">Clear</button>
    </div>

    <div id="output"></div>

    <footer>
      <a href="./">Tools</a> &middot;
      <a href="https://github.com/henrythach/tools/blob/main/csv-to-json.html">Source</a>
    </footer>

    <script>
      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");
      const errorEl = document.getElementById("error");
      const metaEl = document.getElementById("meta");

      const detectDelimiter = (line) => {
        const counts = { ",": 0, "\t": 0, ";": 0 };
        let inQuote = false;
        for (const ch of line) {
          if (ch === '"') inQuote = !inQuote;
          if (!inQuote && ch in counts) counts[ch]++;
        }
        return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
      };

      // RFC 4180-compliant CSV parser for a single delimiter
      const parseCSV = (text, delim) => {
        const rows = [];
        let row = [];
        let field = "";
        let inQuote = false;
        let i = 0;

        while (i < text.length) {
          const ch = text[i];

          if (inQuote) {
            if (ch === '"') {
              if (text[i + 1] === '"') {
                field += '"';
                i += 2;
              } else {
                inQuote = false;
                i++;
              }
            } else {
              field += ch;
              i++;
            }
          } else {
            if (ch === '"') {
              inQuote = true;
              i++;
            } else if (ch === delim) {
              row.push(field);
              field = "";
              i++;
            } else if (ch === "\r" && text[i + 1] === "\n") {
              row.push(field);
              rows.push(row);
              row = [];
              field = "";
              i += 2;
            } else if (ch === "\n") {
              row.push(field);
              rows.push(row);
              row = [];
              field = "";
              i++;
            } else {
              field += ch;
              i++;
            }
          }
        }

        // Flush last row (no trailing newline)
        if (field !== "" || row.length > 0) {
          row.push(field);
          rows.push(row);
        }

        return rows;
      };

      let lastJSON = "";

      const convert = () => {
        errorEl.textContent = "";
        metaEl.textContent = "";
        outputEl.textContent = "";
        lastJSON = "";

        const raw = inputEl.value;
        if (!raw.trim()) return;

        const firstLine = raw.split(/\r?\n/)[0];
        const delim = detectDelimiter(firstLine);
        const delimLabel = delim === "\t" ? "tab" : delim === ";" ? "semicolon" : "comma";

        const rows = parseCSV(raw, delim);

        // Drop trailing empty rows (e.g. file ends with newline)
        while (rows.length > 0 && rows[rows.length - 1].every((f) => f === "")) {
          rows.pop();
        }

        if (rows.length < 2) {
          errorEl.textContent = "Need at least a header row and one data row.";
          return;
        }

        const headers = rows[0];
        const dataRows = rows.slice(1);

        const result = dataRows.map((row) => {
          const obj = {};
          headers.forEach((h, i) => {
            obj[h] = i < row.length ? row[i] : "";
          });
          return obj;
        });

        lastJSON = JSON.stringify(result, null, 2);
        outputEl.textContent = lastJSON;
        metaEl.textContent = `${dataRows.length} row${dataRows.length !== 1 ? "s" : ""} · ${headers.length} column${headers.length !== 1 ? "s" : ""} · delimiter: ${delimLabel}`;
      };

      inputEl.addEventListener("input", convert);

      document.getElementById("copy").addEventListener("click", () => {
        if (!lastJSON) return;
        navigator.clipboard.writeText(lastJSON).then(() => {
          const btn = document.getElementById("copy");
          const orig = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = orig), 1500);
        });
      });

      document.getElementById("clear").addEventListener("click", () => {
        inputEl.value = "";
        outputEl.textContent = "";
        errorEl.textContent = "";
        metaEl.textContent = "";
        lastJSON = "";
        inputEl.focus();
      });
    </script>
  </body>
</html>
