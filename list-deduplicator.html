<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Deduplicator</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #fff;
        --text: #1a1a1a;
        --text-muted: #666;
        --border: #ccc;
        --border-subtle: #e0e0e0;
        --border-footer: #eee;
        --input-bg: #fff;
        --btn-bg: #fff;
        --btn-hover: #f5f5f5;
        --accent: #4a90d9;
        --accent-hover: #3a7bc8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --text: #e8e8e8;
          --text-muted: #999;
          --border: #444;
          --border-subtle: #333;
          --border-footer: #2e2e2e;
          --input-bg: #252525;
          --btn-bg: #2a2a2a;
          --btn-hover: #333;
          --accent: #5a9fd4;
          --accent-hover: #4a8fc4;
        }
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 1.5rem;
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
        max-width: 700px;
        margin: 0 auto;
      }

      h1 {
        font-size: 1.4rem;
        margin-bottom: 0.25rem;
      }

      .subtitle {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }

      textarea {
        width: 100%;
        height: 160px;
        font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
        font-size: 0.8rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--input-bg);
        color: var(--text);
        resize: vertical;
      }

      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      .field {
        margin-bottom: 1rem;
      }

      .options {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        margin: 1rem 0;
        flex-wrap: wrap;
      }

      .checkbox-option {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.85rem;
      }

      .checkbox-option input {
        width: 1rem;
        height: 1rem;
      }

      .mode-toggle {
        display: flex;
        gap: 0;
      }
      .mode-toggle button {
        flex: 1;
        border: 1px solid var(--border);
        background: var(--btn-bg);
        color: var(--text);
        cursor: pointer;
      }
      .mode-toggle button:first-child {
        border-radius: 6px 0 0 6px;
        border-right: none;
      }
      .mode-toggle button:last-child {
        border-radius: 0 6px 6px 0;
      }
      .mode-toggle button.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .mode-toggle button:not(.active):hover {
        background: var(--btn-hover);
      }

      button {
        font-family: inherit;
        font-size: 0.85rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--btn-bg);
        color: var(--text);
        cursor: pointer;
      }
      button:hover {
        background: var(--btn-hover);
      }

      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      button.primary:hover {
        background: var(--accent-hover);
      }

      .actions {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 1rem;
      }

      .output-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.35rem;
      }

      .stats {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      footer {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-footer);
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      footer a {
        color: var(--text-muted);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <h1>List Deduplicator</h1>
    <p class="subtitle">
      Paste a space- or newline-separated list (OAuth scopes, tags, keywords) and get back a deduplicated,
      alphabetically sorted result.
    </p>

    <div class="field">
      <label for="input">Input</label>
      <textarea id="input" spellcheck="false" placeholder="scope.one scope.two&#10;scope.one scope.three"></textarea>
    </div>

    <div class="options">
      <label class="checkbox-option">
        <input type="checkbox" id="case-sensitive" checked />
        Case-sensitive
      </label>
      <div class="mode-toggle" id="format-toggle">
        <button type="button" data-format="newline" class="active">Newline</button>
        <button type="button" data-format="space">Space</button>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="process">Deduplicate &amp; Sort</button>
    </div>

    <div class="output-header">
      <label for="output">Output</label>
      <span class="stats" id="stats"></span>
    </div>
    <textarea id="output" spellcheck="false" readonly></textarea>
    <div class="actions">
      <button id="copy">Copy</button>
    </div>

    <footer>
      <a href="./">Tools</a> &middot;
      <a href="https://github.com/henrythach/tools/blob/main/list-deduplicator.html">Source</a>
    </footer>

    <script>
      const inputEl = document.getElementById("input");
      const outputEl = document.getElementById("output");
      const statsEl = document.getElementById("stats");
      const caseSensitiveEl = document.getElementById("case-sensitive");
      const formatToggleEl = document.getElementById("format-toggle");

      let uniqueTokens = [];
      let outputFormat = "newline";

      const process = () => {
        const caseSensitive = caseSensitiveEl.checked;
        const tokens = inputEl.value.split(/\s+/).filter((t) => t.length > 0);

        const seen = new Set();
        const result = [];
        for (const token of tokens) {
          const key = caseSensitive ? token : token.toLowerCase();
          if (!seen.has(key)) {
            seen.add(key);
            result.push(token);
          }
        }

        result.sort((a, b) => {
          const x = caseSensitive ? a : a.toLowerCase();
          const y = caseSensitive ? b : b.toLowerCase();
          return x < y ? -1 : x > y ? 1 : 0;
        });

        uniqueTokens = result;
        const duplicates = tokens.length - result.length;
        statsEl.textContent = tokens.length
          ? `${result.length} unique · ${duplicates} duplicate${duplicates !== 1 ? "s" : ""} removed`
          : "";

        render();
      };

      const render = () => {
        outputEl.value = uniqueTokens.join(outputFormat === "newline" ? "\n" : " ");
      };

      document.getElementById("process").addEventListener("click", process);

      formatToggleEl.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-format]");
        if (!btn) return;
        outputFormat = btn.dataset.format;
        formatToggleEl.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b === btn));
        render();
      });

      document.getElementById("copy").addEventListener("click", () => {
        navigator.clipboard.writeText(outputEl.value);
      });
    </script>
  </body>
</html>
