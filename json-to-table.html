<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON to Table</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fff;
      --text: #1a1a1a;
      --text-muted: #666;
      --border: #ccc;
      --border-strong: #ccc;
      --border-subtle: #e0e0e0;
      --border-footer: #eee;
      --input-bg: #fff;
      --btn-bg: #fff;
      --btn-hover: #f5f5f5;
      --th-bg: #fff;
      --tr-hover: #f8f8f8;
      --accent: #4a90d9;
      --accent-hover: #3a7bc8;
      --error: #c0392b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --text: #e8e8e8;
        --text-muted: #999;
        --border: #444;
        --border-strong: #555;
        --border-subtle: #333;
        --border-footer: #2e2e2e;
        --input-bg: #252525;
        --btn-bg: #2a2a2a;
        --btn-hover: #333;
        --th-bg: #1a1a1a;
        --tr-hover: #242424;
        --accent: #5a9fd4;
        --accent-hover: #4a8fc4;
        --error: #e05c4b;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    textarea {
      width: 100%;
      height: 180px;
      font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
      font-size: 0.8rem;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      resize: vertical;
      background: var(--input-bg);
      color: var(--text);
    }

    textarea:focus { outline: 2px solid var(--accent); border-color: var(--accent); }

    .actions {
      display: flex;
      gap: 0.5rem;
      margin: 0.75rem 0;
      align-items: center;
    }

    button {
      padding: 0.4rem 0.9rem;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--btn-bg);
      color: var(--text);
      cursor: pointer;
    }

    button:hover { background: var(--btn-hover); }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-hover); }

    .error {
      color: var(--error);
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .table-wrap {
      margin-top: 0.5rem;
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 0.8rem;
    }

    th, td {
      text-align: left;
      padding: 0.35rem 0.65rem;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    th {
      font-weight: 600;
      border-bottom: 2px solid var(--border-strong);
      position: sticky;
      top: 0;
      background: var(--th-bg);
    }

    tr:hover td { background: var(--tr-hover); }

    .row-count {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-footer);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    footer a { color: var(--text-muted); }
  </style>
</head>
<body>
  <h1>JSON to Table</h1>
  <p class="subtitle">Paste a JSON array and get a table. Nested objects become dot-notation columns.</p>

  <textarea id="input" placeholder='[{"name": "Alice", "age": 30, "address": {"city": "NYC"}}]' spellcheck="false"></textarea>
  <div id="error" class="error"></div>

  <div class="actions">
    <button class="primary" id="convert">Convert</button>
    <button id="copy">Copy Table as HTML</button>
    <button id="clear">Clear</button>
    <span class="row-count" id="row-count"></span>
  </div>

  <div class="table-wrap" id="output"></div>

  <footer>
    <a href="./">Tools</a> &middot; <a href="https://github.com/henrythach/tools/blob/main/json-to-table.html">Source</a>
  </footer>

  <script>
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const errorEl = document.getElementById('error');
    const rowCountEl = document.getElementById('row-count');

    // Flatten a nested object into dot-notation keys
    const flatten = (obj, prefix = '') => {
      const result = {};
      for (const [key, value] of Object.entries(obj)) {
        const path = prefix ? `${prefix}.${key}` : key;
        if (value !== null && typeof value === 'object' && !Array.isArray(value)) {
          Object.assign(result, flatten(value, path));
        } else {
          result[path] = value;
        }
      }
      return result;
    };

    const convert = () => {
      errorEl.textContent = '';
      outputEl.innerHTML = '';
      rowCountEl.textContent = '';

      const raw = inputEl.value.trim();
      if (!raw) return;

      let data;
      try {
        data = JSON.parse(raw);
      } catch (e) {
        errorEl.textContent = `Invalid JSON: ${e.message}`;
        return;
      }

      if (!Array.isArray(data)) {
        errorEl.textContent = 'Input must be a JSON array.';
        return;
      }

      if (data.length === 0) {
        errorEl.textContent = 'Array is empty.';
        return;
      }

      // Flatten all rows and collect all unique columns in order of appearance
      const flatRows = data.map(row => (typeof row === 'object' && row !== null) ? flatten(row) : { value: row });
      const colSet = new Set();
      flatRows.forEach(row => Object.keys(row).forEach(k => colSet.add(k)));
      const columns = [...colSet];

      // Build table
      const table = document.createElement('table');

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      for (const col of columns) {
        const th = document.createElement('th');
        th.textContent = col;
        headerRow.appendChild(th);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      for (const row of flatRows) {
        const tr = document.createElement('tr');
        for (const col of columns) {
          const td = document.createElement('td');
          const val = row[col];
          if (val === undefined || val === null) {
            td.textContent = '';
          } else if (Array.isArray(val)) {
            td.textContent = JSON.stringify(val);
          } else {
            td.textContent = String(val);
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);

      outputEl.appendChild(table);
      rowCountEl.textContent = `${data.length} row${data.length !== 1 ? 's' : ''}`;
    };

    document.getElementById('convert').addEventListener('click', convert);

    document.getElementById('copy').addEventListener('click', () => {
      const table = outputEl.querySelector('table');
      if (!table) return;
      navigator.clipboard.writeText(table.outerHTML);
    });

    document.getElementById('clear').addEventListener('click', () => {
      inputEl.value = '';
      outputEl.innerHTML = '';
      errorEl.textContent = '';
      rowCountEl.textContent = '';
      inputEl.focus();
    });

    // Convert on Cmd/Ctrl+Enter
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        convert();
      }
    });
  </script>
</body>
</html>
